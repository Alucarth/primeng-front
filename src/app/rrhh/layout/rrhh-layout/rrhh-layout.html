<div
  class="rrhh-layout"
  [class.rrhh-layout--menu-open]="isMobileMenuOpen()"
  [class.rrhh-layout--sidebar-collapsed]="isSidebarCollapsed()"
>
  <button
    class="rrhh-layout__backdrop"
    type="button"
    aria-label="Cerrar menú"
    tabindex="-1"
    (click)="closeMobileMenu()"
  ></button>

  <div class="rrhh-layout__sidebar">
    <app-sidebar
      [collapsed]="isSidebarCollapsed()"
      (collapsedChange)="setSidebarCollapsed($event)"
      (closeRequested)="closeMobileMenu()"
    />
  </div>

  <div class="rrhh-layout__main">
    <header class="rrhh-layout__mobile-header">
      <button
        class="rrhh-layout__menu-toggle"
        type="button"
        [attr.aria-label]="isMobileMenuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        [attr.aria-expanded]="isMobileMenuOpen()"
        (click)="toggleMobileMenu()"
      >
        <i class="ki-duotone ki-burger-menu" aria-hidden="true"></i>
      </button>
      <span class="rrhh-layout__mobile-title">Vira <span>· RRHH</span></span>
    </header>

    <main class="rrhh-layout__content" id="contenido-principal">
      <router-outlet />
    </main>
  </div>
</div>
