<aside class="sidebar" aria-label="Navegación de Vira Recursos Humanos">
  <div class="sidebar__brand">
    <a class="sidebar__brand-link" routerLink="/" aria-label="Vira Recursos Humanos, inicio" (click)="closeRequested.emit()">
      <span class="sidebar__brand-mark" aria-hidden="true">V</span>
      <span class="sidebar__brand-copy">
        <span class="sidebar__brand-name">VIRA</span>
        <span class="sidebar__brand-caption">Recursos humanos</span>
      </span>
    </a>
    <button
      class="sidebar__close"
      type="button"
      aria-label="Cerrar menú"
      (click)="closeRequested.emit()"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>

  <label class="sidebar__search">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.8" />
      <path d="m16 16 4.2 4.2" />
    </svg>
    <span class="sidebar__sr-only">Buscar en el menú</span>
    <input
      type="search"
      placeholder="Buscar"
      autocomplete="off"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
  </label>

  <nav class="sidebar__navigation" aria-label="Secciones">
    <p class="sidebar__section-label">Espacio de trabajo</p>
    <ul class="sidebar__menu">
      @for (item of filteredNavItems(); track item.label) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.route"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
            (click)="closeRequested.emit()"
          >
            @if (item.icon === 'home') {
              <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3.5 10 8.5-7 8.5 7v9a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 19z" />
                <path d="M9 20.5v-7h6v7" />
              </svg>
            } @else {
              <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M16 20.5v-1.7a3.8 3.8 0 0 0-3.8-3.8H6.3a3.8 3.8 0 0 0-3.8 3.8v1.7" />
                <circle cx="9.2" cy="7.2" r="3.7" />
                <path d="M21.5 20.5v-1.7a3.8 3.8 0 0 0-2.8-3.7M15.7 3.6a3.8 3.8 0 0 1 0 7.3" />
              </svg>
            }
            <span>{{ item.label }}</span>
          </a>
        </li>
      } @empty {
        <li class="sidebar__empty">No se encontraron secciones</li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__profile" aria-label="Perfil de administración">
      <span class="sidebar__avatar" aria-hidden="true">AD</span>
      <span class="sidebar__profile-copy">
        <span class="sidebar__profile-name">Administración</span>
        <span class="sidebar__profile-role">Gestión de personas</span>
      </span>
    </div>
  </div>
</aside>
